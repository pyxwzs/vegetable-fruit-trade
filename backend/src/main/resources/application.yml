server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: vegetable-fruit-trade

  devtools:
    restart:
      enabled: true
      # 等待编译完成后再重启；poll-interval 必须大于 quiet-period
      poll-interval: 4s
      quiet-period: 2s
      exclude: static/**,public/**,templates/**,META-INF/maven/**

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trade_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        cache:
          use_second_level_cache: false
          use_query_cache: false
        jdbc:
          batch_size: 20
        enable_lazy_load_no_trans: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# JWT配置
jwt:
  secret: your-secret-key-here-change-in-production
  expiration: 86400000
  refresh-expiration: 604800000
  refresh-expiration-remember: 2592000000

app:
  upload-dir: uploads

wechat:
  mini-program:
    app-id: wx547f5abb5ec6b5a7
    app-secret: a1d03db1750abe10d87d14ceee93dd01
    mock-enabled: false

logging:
  level:
    com.trade: INFO
    org.springframework.security: WARN
